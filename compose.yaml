# Local presentation stack: two separate databases preserve the account and event schema ownership.
services:
  accounts-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: community360
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - accounts-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d community360"]
      interval: 5s
      timeout: 5s
      retries: 15
  events-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: community_events
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - events-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d community_events"]
      interval: 5s
      timeout: 5s
      retries: 15
  accounts-api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://accounts-db:5432/community360
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      accounts-db:
        condition: service_healthy
  events-api:
    build: ./events-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://events-db:5432/community_events
      EVENT_DB_USER: ${DB_USER:-postgres}
      EVENT_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      events-db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - accounts-api
      - events-api
volumes:
  accounts-data:
  events-data:
